name: Verify Google Translator Add-on Source

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-google-translator.yml"
      - "translator-google/**"
  pull_request:
    paths:
      - ".github/workflows/build-google-translator.yml"
      - "translator-google/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: google-translator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  universal:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: translator-google/**/*.gradle*

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          SDKMANAGER="$ANDROID_SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ -z "$ANDROID_SDK" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found at $SDKMANAGER" >&2
            exit 1
          fi
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;36.0.0"

      - name: Build unsigned universal APK
        working-directory: translator-google
        run: ./gradlew :app:assembleRelease -PaddonAbi=universal --console=plain

      - name: Verify ML Kit registrar constructors survive R8
        shell: bash
        run: |
          set -euo pipefail
          MAPPING="translator-google/app/build/outputs/mapping/release/mapping.txt"
          python3 - "$MAPPING" <<'PY'
          import re
          import sys

          targets = {
              "com.google.mlkit.common.internal.CommonComponentRegistrar",
              "com.google.mlkit.nl.translate.NaturalLanguageTranslateRegistrar",
          }
          blocks = {}
          current = None
          with open(sys.argv[1], encoding="utf-8") as stream:
              for line in stream:
                  match = re.match(r"^([^ ].*?) -> .*:$", line.rstrip())
                  if match:
                      current = match.group(1)
                      if current in targets:
                          blocks[current] = []
                      continue
                  if current in blocks:
                      blocks[current].append(line)

          missing_classes = sorted(targets - blocks.keys())
          missing_constructors = sorted(
              name for name, lines in blocks.items()
              if not any("void <init>()" in line for line in lines)
          )
          if missing_classes or missing_constructors:
              raise SystemExit(
                  "ML Kit registrar R8 verification failed: "
                  f"missing_classes={missing_classes}, "
                  f"missing_constructors={missing_constructors}"
              )
          print("Verified ML Kit registrar constructors:", ", ".join(sorted(targets)))
          PY

      # This repository intentionally has no signing key and publishes no APK
      # artifact. Installable builds are created only by the protected
      # release-signing workflow in Dashchan_2, which verifies the Slooop
      # certificate before exposing an artifact or updating a Release asset.
      - name: Verify unsigned universal APK
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          APK="translator-google/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$APK"
          if "$ANDROID_SDK/build-tools/36.0.0/apksigner" verify "$APK" >/dev/null 2>&1; then
            echo "Source CI unexpectedly produced a signed APK" >&2
            exit 1
          fi
          "$ANDROID_SDK/build-tools/36.0.0/aapt" dump badging \
            "$APK" | \
            grep -E "^(package:|native-code:)"
          sha256sum "$APK"
          {
            echo "### Source build verified"
            echo
            echo "The APK is intentionally unsigned and was not uploaded."
            echo "Use the protected Dashchan_2 release-signing workflow for an installable add-on."
          } >> "$GITHUB_STEP_SUMMARY"
