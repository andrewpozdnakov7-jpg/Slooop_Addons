name: Build Google Translator Add-on

on:
  push:
    branches:
      - agent/google-translation-addon
    paths:
      - ".github/workflows/build-google-translator.yml"
      - "translator-google/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: google-translator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  universal:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: translator-google/**/*.gradle*

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37" "build-tools;36.0.0"

      - name: Build unsigned universal APK
        working-directory: translator-google
        run: ./gradlew :app:assembleRelease -PaddonAbi=universal --console=plain

      - name: Sign and verify universal APK
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.GOOGLE_TRANSLATOR_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.GOOGLE_TRANSLATOR_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.GOOGLE_TRANSLATOR_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.GOOGLE_TRANSLATOR_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for value in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!value:-}" ]; then
              echo "Required signing secret is missing: $value" >&2
              exit 1
            fi
          done
          mkdir -p dist .signing
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > .signing/google-translator.p12
          chmod 600 .signing/google-translator.p12
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -f -p 4 \
            translator-google/app/build/outputs/apk/release/app-release-unsigned.apk \
            dist/Slooop-Google-Translator-universal-aligned.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks .signing/google-translator.p12 \
            --ks-type PKCS12 \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out dist/Slooop-Google-Translator-universal.apk \
            dist/Slooop-Google-Translator-universal-aligned.apk
          rm dist/Slooop-Google-Translator-universal-aligned.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs \
            dist/Slooop-Google-Translator-universal.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging \
            dist/Slooop-Google-Translator-universal.apk | \
            grep -E "^(package:|native-code:)"
          sha256sum dist/Slooop-Google-Translator-universal.apk

      - name: Upload signed universal APK
        uses: actions/upload-artifact@v4
        with:
          name: google-translator-universal-signed
          path: dist/Slooop-Google-Translator-universal.apk
          if-no-files-found: error
          retention-days: 7
